<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ehGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="24" fill="url(#ehGrad)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Ticket Glyph with Notches -->
  <path d="M 26 32
           C 26 27, 30 24, 36 24
           L 64 24
           C 70 24, 74 27, 74 32
           L 74 44
           A 6 6 0 0 0 74 56
           L 74 68
           C 74 73, 70 76, 64 76
           L 36 76
           C 30 76, 26 73, 26 68
           L 26 56
           A 6 6 0 0 0 26 44
           Z"
        fill="rgba(255, 255, 255, 0.95)"
        filter="url(#glow)"/>

  <!-- Ticket Inner Divider Dashed Line -->
  <line x1="33" y1="50" x2="67" y2="50" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- 4-point Sparkle / Star at top half -->
  <path d="M 50 30 Q 50 37 43 37 Q 50 37 50 44 Q 50 37 57 37 Q 50 37 50 30 Z" fill="#6366f1"/>

  <!-- Bottom Stylized Equalizer / Barcode Bars -->
  <rect x="36" y="58" width="4" height="10" rx="1.5" fill="#8b5cf6"/>
  <rect x="43" y="55" width="4" height="13" rx="1.5" fill="#6366f1"/>
  <rect x="50" y="57" width="4" height="11" rx="1.5" fill="#ec4899"/>
  <rect x="57" y="54" width="4" height="14" rx="1.5" fill="#8b5cf6"/>
  <rect x="64" y="59" width="3" height="9" rx="1.5" fill="#6366f1"/>
</svg>