name: CI - Lint, Test & Smoke Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Python Backend & Security Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Database Initialization & Migrations
        run: |
          python database.py

      - name: Run Automated Test Suite
        run: |
          python demo-project/test-api.py

      - name: Smoke Test Local HTTP Server & API Endpoints
        run: |
          python server.py &
          SERVER_PID=$!
          sleep 2
          curl -f http://127.0.0.1:3000/api/db/status || exit 1
          curl -f http://127.0.0.1:3000/api/firewall/summary || exit 1
          curl -f http://127.0.0.1:3000/api/get-email-status || exit 1
          kill $SERVER_PID

  frontend-check:
    name: Frontend Modular Syntax & Static Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax Check All Modular JavaScript Files
        run: |
          find . -maxdepth 2 -name "*.js" ! -path "*/node_modules/*" -exec node -c {} +
          echo "✅ All JavaScript modules passed syntax validation."
